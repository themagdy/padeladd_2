<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Padeladd - Reset Password</title>

    <!-- OpenGraph Tags -->
    <meta property="og:title" content="Padeladd - Reset Password">
    <meta property="og:description" content="Please reset your Padeladd password directly inside the mobile app on your phone.">
    <meta property="og:image" content="../../assets/padeladd_share_thumb.jpg">

    <link rel="icon" type="image/png" href="../../assets/logo_ico.png">
    <link rel="stylesheet" href="../app/style.css">
    
    <style>
        .reset-page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            position: relative;
            z-index: 10;
        }

        .reset-card-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 480px;
            margin: 40px auto;
        }

        .reset-card {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg, 24px);
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .reset-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--color-primary, #00E5FF), transparent);
        }

        .reset-icon-badge {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.15) 0%, rgba(13, 17, 23, 0.4) 70%);
            border: 1px solid rgba(0, 229, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
        }

        .reset-icon-badge svg {
            width: 38px;
            height: 38px;
            color: var(--color-primary, #00E5FF);
        }

        .reset-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--c-text-muted, #8B949E);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .reset-title {
            font-size: 26px;
            font-weight: 800;
            color: #FFFFFF;
            margin: 0 0 14px 0;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        .reset-description {
            font-size: 15px;
            color: var(--c-text-muted, #8B949E);
            line-height: 1.6;
            margin: 0 0 32px 0;
            font-weight: 400;
        }

        .reset-btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border-radius: var(--radius-md, 14px);
            background: linear-gradient(135deg, var(--color-primary, #00E5FF) 0%, #00B0FF 100%);
            color: #000000;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .reset-btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 229, 255, 0.45);
        }

        .reset-footer {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            text-align: center;
            margin-top: auto;
            padding-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="reset-page-container">
        
        <!-- Header -->
        <header class="navbar" style="position: relative; top: 0; background: transparent; border-bottom: none; width: 100%;">
            <a href="https://padeladd.com" class="brand-logo" style="margin: 0 auto;">
                <img src="../../assets/logo.png" alt="Padeladd" class="logo-img" style="height: 48px; width: auto;" onerror="this.onerror=null; this.src='../../assets/logo_ico.png';">
            </a>
        </header>

        <!-- Main Card -->
        <div class="reset-card-wrapper">
            <div class="reset-card">
                
                <div class="reset-icon-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                </div>

                <div class="reset-status-pill">
                    <span>🔒</span> SECURITY NOTICE
                </div>

                <h1 class="reset-title">Reset Password on Your Mobile Phone</h1>

                <p class="reset-description">
                    For your account security, please open the <strong>Padeladd mobile app</strong> on your phone to complete your password reset.
                </p>

                <a href="https://padeladd.com" class="reset-btn-action">
                    <span>Open Padeladd App</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>

            </div>
        </div>

        <!-- Footer -->
        <footer class="reset-footer">
            &copy; 2026 Padeladd. All rights reserved.
        </footer>

    </div>

</body>
</html>
