<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Padeladd - Something Big is Coming</title>

    <!-- OpenGraph Tags -->
    <meta property="og:title" content="Padeladd - Launching August 25">
    <meta property="og:description" content="Egypt's Premier Padel Network is launching soon. Count down to the official release on August 25.">
    <meta property="og:image" content="../../assets/padeladd_share_thumb.jpg">

    <link rel="icon" type="image/png" href="../../assets/logo_ico.png">
    <link rel="stylesheet" href="../app/style.css">

    <style>
        body {
            background-color: #030508;
            color: #ffffff;
            font-family: 'Outfit', 'Montserrat', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            position: relative;
        }

        /* Ambient Lighting Effects */
        body::before {
            content: '';
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 900px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(212, 175, 55, 0.08) 40%, transparent 70%);
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
        }

        .teaser-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            z-index: 10;
            text-align: center;
        }

        /* Centered Logo */
        .teaser-logo-wrap {
            margin-bottom: 36px;
        }

        .teaser-logo {
            height: 64px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 8px 32px rgba(56, 189, 248, 0.3));
        }

        /* Status Badge */
        .teaser-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 44px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .teaser-pulse {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Teaser Headline Typography */
        .teaser-headline {
            font-size: 48px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
            margin: 0 0 14px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .teaser-line-1 {
            color: #ffffff;
            font-weight: 400;
        }

        .teaser-line-2 {
            font-weight: 800;
        }

        .teaser-subtitle {
            font-size: 16px;
            color: #94a3b8;
            max-width: 480px;
            margin: 0 auto 36px auto;
            line-height: 1.5;
            font-weight: 400;
        }

        @media (max-width: 600px) {
            .teaser-headline {
                font-size: 34px;
            }
            .teaser-subtitle {
                font-size: 14px;
                margin-bottom: 28px;
            }
        }

        /* Countdown Grid */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        .countdown-card {
            background: rgba(12, 16, 26, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .countdown-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
        }

        .countdown-num {
            font-family: 'Outfit', 'Inter', monospace;
            font-size: 52px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .countdown-label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Minimal Luxury Footer */
        .teaser-footer {
            width: 100%;
            padding: 32px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 800px;
            margin: 0 auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
            font-size: 12px;
            color: #64748b;
        }

        .teaser-footer a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .teaser-footer a:hover {
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .teaser-logo {
                height: 52px;
            }

            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                max-width: 320px;
            }

            .countdown-card {
                padding: 22px 12px;
                border-radius: 20px;
            }

            .countdown-num {
                font-size: 42px;
            }

            .teaser-footer {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="teaser-container">
        
        <!-- Centered Logo -->
        <div class="teaser-logo-wrap">
            <a href="https://padeladd.com">
                <img src="../../assets/logo.png" alt="Padeladd" class="teaser-logo" onerror="this.onerror=null; this.src='../../assets/logo_ico.png';">
            </a>
        </div>

        <!-- Teaser Status Badge -->
        <div class="teaser-pill">
            <span class="teaser-pulse"></span> LAUNCHING AUGUST 25
        </div>

        <!-- Teaser Headline & Subtitle -->
        <h1 class="teaser-headline">
            <span class="teaser-line-1">The Game Is</span>
            <span class="teaser-line-2 gradient-text">Shifting.</span>
        </h1>

        <p class="teaser-subtitle">
            Get ready for Egypt's ultimate padel experience.
        </p>

        <!-- Live Countdown Grid -->
        <div class="countdown-grid">
            <div class="countdown-card">
                <span class="countdown-num" id="days">00</span>
                <span class="countdown-label">Days</span>
            </div>

            <div class="countdown-card">
                <span class="countdown-num" id="hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>

            <div class="countdown-card">
                <span class="countdown-num" id="minutes">00</span>
                <span class="countdown-label">Minutes</span>
            </div>

            <div class="countdown-card">
                <span class="countdown-num" id="seconds">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="teaser-footer">
        <div>&copy; 2026 Padeladd. All rights reserved.</div>
        <div>
            <a href="https://www.instagram.com/thepadeladd/" target="_blank" rel="noopener noreferrer">Follow on Instagram ↗</a>
        </div>
    </footer>

    <!-- Countdown Timer Logic -->
    <script>
        (function() {
            // Target Launch Date: August 25, 2026 00:00:00 EEST (Cairo GMT+3)
            const targetDate = new Date('2026-08-25T00:00:00+03:00').getTime();

            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');

            function updateCountdown() {
                const now = new Date().getTime();
                const diff = targetDate - now;

                if (diff <= 0) {
                    daysEl.textContent = '00';
                    hoursEl.textContent = '00';
                    minutesEl.textContent = '00';
                    secondsEl.textContent = '00';
                    return;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                daysEl.textContent = String(d).padStart(2, '0');
                hoursEl.textContent = String(h).padStart(2, '0');
                minutesEl.textContent = String(m).padStart(2, '0');
                secondsEl.textContent = String(s).padStart(2, '0');
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        })();
    </script>
</body>
</html>
