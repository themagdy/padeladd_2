<div class="auth-page desktop-split-auth page active">
  <header class="auth-desk-header">
    <div class="auth-desk-header-inner"
      style="display:flex; justify-content:space-between; align-items:center; width:100%; max-width:1440px; margin:0 auto; padding:0 80px;">
      <div class="header-logo">
        <img src="assets/logo.png" alt="Padeladd" style="height: 54px; width: auto;">
      </div>
      <a href="https://www.instagram.com/thepadeladd/" target="_blank" rel="noopener noreferrer"
        class="header-link">CONTACT US</a>
    </div>
  </header>

  <div class="auth-split-container">

    <!-- Left Side: Marketing -->
    <div class="auth-marketing">
      <div class="marketing-img hidden-mobile">
        <img src="assets/landing_banner.jpg" alt="Padeladd Egypt"
          style="width:100%; height:280px; object-fit:cover; border-radius: var(--r-sm); margin-bottom:40px;">
      </div>
      <div class="marketing-content">
        <div class="hero-pills" style="display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
          <div class="tag-pill" style="display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--c-text-muted); font-size: 10.5px; font-weight: 700; padding: 6px 14px; border-radius: 999px; letter-spacing: 1.2px;">
            <span class="flag-icon" style="font-size: 12px;">🇪🇬</span> EGYPT
          </div>
          <a href="https://www.instagram.com/thepadeladd/" target="_blank" rel="noopener noreferrer" class="btn-instagram" style="display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, rgba(225, 48, 108, 0.12), rgba(253, 29, 29, 0.12)); border: 1px solid rgba(225, 48, 108, 0.3); padding: 6px 14px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #ffffff; text-decoration: none; transition: all 0.25s ease;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            <span>Follow Padeladd</span>
          </a>
        </div>
        <h1 class="marketing-headline" style="font-weight:800; font-size:46px; margin:0 0 16px 0; line-height:1.05; letter-spacing: -0.5px;">
          <span style="display:block; color:#ffffff; font-weight:400;">Egypt’s Premier</span>
          <span class="gradient-text" style="display:block; font-weight:800;">Padel Network.</span>
        </h1>
        <p class="marketing-desc hidden-mobile" style="color:var(--c-text-muted); font-size:15px; line-height:1.6; margin-bottom:24px;">Track live match scores, climb national rankings, and challenge verified padel players across Egypt.</p>
        <button class="btn btn-primary" style="padding:16px 40px; font-size:16px; width:auto;" data-link
          href="/register">Sign up, it's Free!</button>
      </div>
    </div>

    <!-- Right Side: The Form -->
    <div class="auth-form-wrap">
      <!-- Unified Title -->
      <h1 class="auth-desk-title" style="font-size:24px; margin-bottom:30px;">Sign in to Padeladd</h1>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label hidden-desktop" for="login-email">Email</label>
          <input class="form-input form-input-lg" type="email" id="login-email" name="email"
            placeholder="Phone number or email address" autocomplete="email" maxlength="255" required>
        </div>

        <div class="form-group">
          <label class="form-label hidden-desktop" for="login-password">Password</label>
          <div class="password-wrap">
            <input class="form-input form-input-lg" type="password" id="login-password" name="password"
              placeholder="Password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg mt-md" id="btn-login" style="padding:16px; font-size:16px;">
          <span>Sign in</span>
        </button>

        <div class="auth-centered-link" style="text-align:center; margin-top:25px;">
          <a data-link href="/forgot-password" class="auth-link text-sm"
            style="color: var(--c-primary); font-weight: 600;">Forgot your password?</a>
        </div>


      </form>
    </div>

  </div>

  <!-- Footer -->
  <footer class="auth-desk-footer" style="margin-top:auto; border-top:1px solid var(--c-border);">
    <div class="auth-desk-footer-inner"
      style="display:flex; justify-content:space-between; width:100%; max-width:1440px; margin:0 auto; padding:30px 80px; color:var(--c-text-dim); font-size:12px;">
      <div class="footer-terms">
        <a data-link href="/terms"
          style="color:var(--c-text-dim); text-decoration:none; font-weight:600; cursor:pointer;">Terms of use</a>
        <span style="margin: 0 8px; opacity:0.35;">|</span>
        <a data-link href="/privacy"
          style="color:var(--c-text-dim); text-decoration:none; font-weight:600; cursor:pointer;">Privacy Policy</a>
      </div>
      <div class="footer-version">Padeladd V<span class="app-version-placeholder"></span></div>
    </div>
  </footer>
</div>
