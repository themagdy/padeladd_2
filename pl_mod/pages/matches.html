<div class="matches-reports-page">
    <!-- Header Search Bar (Synced to mod panel header by app.js) -->
    <div id="page-search-source" style="display:none;">
        <div class="search-wrap" style="position:relative; width:440px; max-width:100%;">
            <input type="text" id="match-search-input" class="form-input" 
                placeholder="Search match code, venue, player name, nickname, xcode..." 
                style="padding-left:40px; padding-right:110px; background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.1); height:44px; font-size:13px; color:#fff; border-radius:10px;">
            <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:0.5; font-size:14px;">🔍</span>
            <button id="match-search-btn" onclick="AdminControllers.matches.onSearchSubmit()" 
                style="position:absolute; right:6px; top:50%; transform:translateY(-50%); background:var(--c-primary); color:#fff; border-radius:8px; padding:6px 14px; font-size:11px; font-weight:800; border:none; cursor:pointer;">
                SEARCH
            </button>
        </div>
    </div>

    <!-- Match Control Header Controls & Filter Tabs -->
    <div class="section-card" style="padding: 20px; margin-bottom: 24px; background: rgba(255,255,255,0.015); border: 1px solid var(--c-border); border-radius: 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
            <div>
                <h2 style="color:#fff; font-size:18px; font-weight:800; margin:0 0 4px 0; display:flex; align-items:center; gap:8px;">
                    🎾 Match Control Center
                </h2>
                <p style="color:var(--c-text-muted); font-size:12px; margin:0;">
                    Showing <b id="match-count-badge" style="color:var(--c-primary);">0</b> total matches matching your criteria
                </p>
            </div>
            <!-- Status Filter Pills -->
            <div class="status-filter-pills" style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="pill-btn active" data-status="all" onclick="AdminControllers.matches.setStatusFilter('all', this)">All Statuses</button>
                <button class="pill-btn" data-status="open" onclick="AdminControllers.matches.setStatusFilter('open', this)">Open</button>
                <button class="pill-btn" data-status="full" onclick="AdminControllers.matches.setStatusFilter('full', this)">Full</button>
                <button class="pill-btn" data-status="on_hold" onclick="AdminControllers.matches.setStatusFilter('on_hold', this)">On Hold</button>
                <button class="pill-btn" data-status="completed" onclick="AdminControllers.matches.setStatusFilter('completed', this)">Completed</button>
                <button class="pill-btn" data-status="cancelled" onclick="AdminControllers.matches.setStatusFilter('cancelled', this)">Cancelled</button>
            </div>
        </div>
    </div>

    <!-- Active Investigation Detail Overlay Card (If single match investigated) -->
    <div id="investigation-result" style="display:none; margin-bottom:28px;"></div>

    <!-- Matches List Container -->
    <div id="admin-matches-list" style="display:flex; flex-direction:column; gap:16px;">
        <!-- Match Cards Rendered Here -->
    </div>

    <!-- Loading Sentinel & Infinite Scroll Indicator -->
    <div id="matches-scroll-sentinel" style="text-align:center; padding:32px 16px; opacity:0.8;">
        <div id="sentinel-spinner" class="loader" style="display:none; color:var(--c-primary); font-size:14px; font-weight:600;">
            ⚡ Loading more matches...
        </div>
        <div id="sentinel-end-msg" style="display:none; color:var(--c-text-dim); font-size:12px;">
            End of results
        </div>
    </div>
</div>

<style>
    .status-filter-pills .pill-btn {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        color: var(--c-text-muted);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .status-filter-pills .pill-btn:hover {
        background: rgba(255,255,255,0.08);
        color: #fff;
    }
    .status-filter-pills .pill-btn.active {
        background: var(--c-primary);
        border-color: var(--c-primary);
        color: #fff;
    }
    .adm-match-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 14px;
        padding: 20px;
        transition: border-color 0.2s ease, transform 0.15s ease;
    }
    .adm-match-card:hover {
        border-color: rgba(255,255,255,0.15);
    }
    .adm-player-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 12px;
    }
    .investigator-header {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
    }
</style>
